[package]
name = "gtnh-updater"
version = "0.7.0"
edition = "2021"

[lib]
name = "gtnh_updater_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
gtnh-core = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"
