[package]
name = "gtnh-updater-gpui"
version = "0.7.0"
edition = "2021"
# gpui-pre 0.3.12 uses std::hint::cold_path (stable since 1.95).
rust-version = "1.95"
publish = false

[[bin]]
name = "gtnh-updater-gpui"
path = "src/main.rs"

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12" }
gpui-component = "0.9.1"
gpui-kit-assets = "0.9.1"
gtnh-core = { path = "../.." }
rfd = "=0.16.1"
open = "=5.4.5"
dirs = "7"
serde_json = "1"
